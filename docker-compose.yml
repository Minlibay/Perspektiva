services:
  backend:
    build: ./backend
    container_name: audit-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - ENABLE_LOCAL_UPLOAD=0
    volumes:
      - ./backend/gigachat_settings.json:/app/gigachat_settings.json
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
    expose:
      - "8000"
    mem_reservation: 1g

  frontend:
    build: ./frontend
    container_name: audit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Порт сайта задаётся в .env: APP_PORT=80, APP_PORT=127.0.0.1:8080 (за HTTPS-прокси) и т. п.
      - "${APP_PORT:-8080}:80"
    mem_limit: 256m
